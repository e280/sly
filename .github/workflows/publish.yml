
name: 📦 npm publish
on:
  push:
    tags:
    - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
      url: "https://www.npmjs.com/package/@e280/sly"
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: "26"
        cache: npm

    - run: npm ci
    - run: npm run build -s
    - run: npm test
    - run: npm publish --ignore-scripts --tag latest

